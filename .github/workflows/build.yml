name: build

on:
  pull_request:
  workflow_dispatch:
  # Manual escape hatch: pushing a v* tag by hand still cuts a release.
  push:
    tags: ["v*"]
  # Called by release.yml, the changelog-driven orchestrator. A non-empty
  # release_version turns this run into a release for that version; empty is a
  # plain CI build.
  workflow_call:
    inputs:
      release_version:
        description: "Version to release (e.g. 0.3.2); empty for a CI-only build"
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        # Full history and tags: setuptools_scm derives the version from the
        # git tag, and a shallow checkout hides it (the binary would then report
        # the fallback version instead of the release tag).
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and PyInstaller
        run: pip install -e . pyinstaller

      - name: Build binary
        run: pyinstaller --clean --noconfirm mdtohtml.spec

      # ---- Smoke tests (Linux/macOS shells) ----
      - name: Smoke test (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN=dist/mdtohtml
          printf '# T\n\n$x^2$ and $$y=1$$\n' > math.md
          "$BIN" math.md --themes-dir mdtohtml/themes -o math.html
          grep -q 'class="katex' math.html
          grep -q 'data:font/woff2;base64' math.html
          if grep -q 'renderMathInElement' math.html; then
            echo "ERROR: math doc ships the client-side KaTeX engine" >&2; exit 1
          fi
          echo "math doc OK (KaTeX pre-rendered, fonts inlined, no JS engine)"

          printf '# P\n\nplain\n' > plain.md
          "$BIN" plain.md --themes-dir mdtohtml/themes -o plain.html
          if grep -q 'class="katex' plain.html; then
            echo "ERROR: plain doc unexpectedly carries KaTeX" >&2; exit 1
          fi
          if grep -q 'data:font' plain.html; then
            echo "ERROR: plain doc unexpectedly carries fonts" >&2; exit 1
          fi
          echo "plain doc OK (zero KaTeX bytes)"

          # Pygments must be bundled into the frozen binary. If its lexers are
          # missing, highlighting silently degrades to plain code and the
          # ``title=`` filename bar never renders -- so assert BOTH a token span
          # and the sheet-head bar produced by a titled fence.
          printf '# H\n\n```{.python title="Demo | demo.py"}\ndef greet(): return 1\n```\n' > hl.md
          "$BIN" hl.md --themes-dir mdtohtml/themes -o hl.html
          grep -q '<span class="k">' hl.html || { echo "ERROR: no Pygments token spans -- highlighting not bundled" >&2; exit 1; }
          grep -q 'class="sheet-head"' hl.html || { echo "ERROR: code-block title bar (sheet-head) missing" >&2; exit 1; }
          echo "code highlighting + title bar OK (Pygments bundled)"

      # ---- Smoke tests (Windows PowerShell) ----
      - name: Smoke test (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "dist/mdtohtml.exe"
          "# T`n`n`$x^2`$ and `$`$y=1`$`$`n" | Set-Content -NoNewline math.md
          & $bin math.md --themes-dir mdtohtml/themes -o math.html
          if (-not (Select-String -Path math.html -Pattern 'class="katex' -SimpleMatch -Quiet)) {
            Write-Error "math doc missing pre-rendered KaTeX"
          }
          if (-not (Select-String -Path math.html -Pattern 'data:font/woff2;base64' -SimpleMatch -Quiet)) {
            Write-Error "math doc missing inlined KaTeX fonts"
          }
          if (Select-String -Path math.html -Pattern 'renderMathInElement' -Quiet) {
            Write-Error "math doc ships the client-side KaTeX engine"
          }
          Write-Host "math doc OK (KaTeX pre-rendered, fonts inlined, no JS engine)"

          "# P`n`nplain`n" | Set-Content -NoNewline plain.md
          & $bin plain.md --themes-dir mdtohtml/themes -o plain.html
          if (Select-String -Path plain.html -Pattern 'class="katex' -SimpleMatch -Quiet) {
            Write-Error "plain doc unexpectedly carries KaTeX"
          }
          if (Select-String -Path plain.html -Pattern 'data:font' -SimpleMatch -Quiet) {
            Write-Error "plain doc unexpectedly carries fonts"
          }
          Write-Host "plain doc OK (zero KaTeX bytes)"

          # Pygments must be bundled into the frozen binary. If its lexers are
          # missing, highlighting silently degrades to plain code and the title
          # filename bar never renders -- so assert BOTH a token span and the
          # sheet-head bar. Single-quoted lines keep the backtick fences and the
          # double quotes literal, so no escaping is needed.
          $lines = @(
            '# H',
            '',
            '```{.python title="Demo | demo.py"}',
            'def greet(): return 1',
            '```'
          )
          ($lines -join "`n") | Set-Content -NoNewline hl.md
          & $bin hl.md --themes-dir mdtohtml/themes -o hl.html
          if (-not (Select-String -Path hl.html -Pattern '<span class="k">' -SimpleMatch -Quiet)) {
            Write-Error "no Pygments token spans -- highlighting not bundled"
          }
          if (-not (Select-String -Path hl.html -Pattern 'class="sheet-head"' -SimpleMatch -Quiet)) {
            Write-Error "code-block title bar (sheet-head) missing"
          }
          Write-Host "code highlighting + title bar OK (Pygments bundled)"

      # On a tag build, the binary MUST self-report the tag version. This guards
      # the setuptools_scm derivation: if the version ever silently regresses to
      # the fallback (e.g. a shallow checkout hides the tag), the mismatch fails
      # the release instead of shipping a binary that misreports itself and nags
      # `update --check`. --themes-dir points at the in-tree themes so the check
      # does not depend on a themes/ folder beside the freshly built binary.
      - name: Assert binary self-reports the release version (bash)
        if: runner.os != 'Windows' && (inputs.release_version != '' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.release_version }}"
          [ -n "$expected" ] || expected="${GITHUB_REF_NAME#v}"
          reported="$(dist/mdtohtml --themes-dir mdtohtml/themes --version | awk '{print $2}')"
          if [ "$reported" != "$expected" ]; then
            echo "ERROR: binary reports version '$reported' but expected '$expected'" >&2
            exit 1
          fi
          echo "version OK ($reported matches $expected)"

      - name: Assert binary self-reports the release version (pwsh)
        if: runner.os == 'Windows' && (inputs.release_version != '' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ inputs.release_version }}"
          if (-not $expected) { $expected = "$env:GITHUB_REF_NAME" -replace '^v', '' }
          $reported = (& "dist/mdtohtml.exe" --themes-dir mdtohtml/themes --version).Split(' ')[1]
          if ($reported -ne $expected) {
            Write-Error "binary reports version '$reported' but expected '$expected'"
          }
          Write-Host "version OK ($reported matches $expected)"

      # The themeless binary, run with no themes/ beside it and no --themes-dir,
      # must fail cleanly (not crash) and point at `update --themes`. Runs
      # non-interactively (no TTY) so it never blocks; guards the themeless-binary
      # + download-on-missing path that the release now depends on.
      - name: Smoke test themeless binary (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf '# T\n\nhello\n' > bare.md
          # The convert is EXPECTED to fail; capture it in an `if` so the
          # runner's `set -e` does not abort on that expected non-zero exit.
          if out="$(dist/mdtohtml bare.md -o bare.html < /dev/null 2>&1)"; then
            echo "ERROR: themeless convert unexpectedly succeeded" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'update --themes' || { echo "ERROR: no themes-fetch guidance shown" >&2; exit 1; }
          echo "themeless binary OK (clean failure + fetch guidance)"

      - name: Smoke test themeless binary (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "# T`n`nhello`n" | Set-Content -NoNewline bare.md
          $out = (& "dist/mdtohtml.exe" bare.md -o bare.html *>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { Write-Host "ERROR: themeless convert unexpectedly succeeded"; exit 1 }
          if ($out -notmatch 'update --themes') { Write-Host "ERROR: no themes-fetch guidance shown"; exit 1 }
          Write-Host "themeless binary OK (clean failure + fetch guidance)"
          # Reset the lingering non-zero $LASTEXITCODE from the expected failure
          # above so the runner does not mark this (passing) step as failed.
          exit 0

      # The binary zip carries only the executable (themeless). Themes ship as a
      # separate, OS-independent asset (mdtohtml-themes.zip), built once on the
      # Linux leg; the binary downloads it on demand when no themes are present.
      - name: Package release zips (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE=dist/release-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp dist/mdtohtml "$STAGE/"
          ( cd "$STAGE" && zip -qr "../mdtohtml-linux-x86_64.zip" . )
          rm -rf "$STAGE"
          # Themes asset: a themes/ folder, built once here (it is not per-OS).
          TSTAGE=dist/themes-stage
          rm -rf "$TSTAGE"
          mkdir -p "$TSTAGE"
          cp -r mdtohtml/themes "$TSTAGE/themes"
          ( cd "$TSTAGE" && zip -qr "../mdtohtml-themes.zip" . )
          rm -rf "$TSTAGE"

      - name: Package release zip (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist/release-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "dist/mdtohtml.exe" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/mdtohtml-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: mdtohtml-${{ matrix.os }}
          path: dist/mdtohtml-*.zip

  release:
    needs: build
    if: ${{ inputs.release_version != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          version="${{ inputs.release_version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download all release zips
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mdtohtml-*
          merge-multiple: true

      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { cap = 1; next }
            cap && (/^## \[/ || /^\[[^]]*\]: /) { cap = 0 }
            cap { print }
          ' CHANGELOG.md > release_notes.md
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $VERSION" >&2
            exit 1
          fi
          echo "----- release notes -----"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: artifacts/mdtohtml-*.zip
