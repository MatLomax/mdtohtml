[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtohtml"
dynamic = ["version"]
description = "Self-contained Markdown to styled HTML converter with callouts, wikilinks, pre-rendered KaTeX math, and mermaid diagrams."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-LICENSES"]
authors = [{ name = "Mathieu Lomax" }]
keywords = ["markdown", "html", "converter", "katex", "mermaid", "callouts", "cli", "pyinstaller"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "markdown>=3.5",
    "pymdown-extensions>=10",
    # Syntax highlighting for fenced code (and the ``title=`` filename bar, which
    # is only emitted when highlighting runs). pymdown-extensions does not depend
    # on Pygments, so it is named explicitly here rather than left transitive.
    "pygments>=2",
    "nh3",
    # Pinned: each bundles a native engine (quickjs-ng) plus, for mermaidx, a
    # specific mermaid.js build, so the exact version fixes both the render
    # output and the wheels bundled into the frozen binary.
    "mermaidx==0.9.5",
    "quickjs-ng==0.16.2.1",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6",
]

[project.urls]
Homepage = "https://github.com/MatLomax/mdtohtml"
Repository = "https://github.com/MatLomax/mdtohtml"
Issues = "https://github.com/MatLomax/mdtohtml/issues"

[project.scripts]
mdtohtml = "mdtohtml.cli:main"

[tool.setuptools]
packages = ["mdtohtml"]

# The version is the single source of truth in the git tag: setuptools_scm
# derives it from `git describe` at build time and writes it to the generated
# (gitignored) mdtohtml/_version.py, which __init__ imports. Building at a
# vX.Y.Z tag yields exactly X.Y.Z; commits past a tag yield a dev version.
# fallback_version keeps a git-less source tree (no tags, no PKG-INFO) building.
[tool.setuptools_scm]
version_file = "mdtohtml/_version.py"
fallback_version = "0.0.0+unknown"

[tool.setuptools.package-data]
mdtohtml = ["themes/*.css", "katex/*"]
